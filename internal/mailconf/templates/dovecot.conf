# EmailZit: written by the root helper from the server settings.
# Changes here are overwritten. Users, passwords (app passwords only) and
# quotas come from PostgreSQL (database {{.DBName}}, role dovecot, views
# mda_users and mda_logins).
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap pop3 lmtp sieve
listen = *, ::
login_greeting = {{.Hostname}} ready.
log_path = syslog
syslog_facility = mail

# ---- TLS only; the plain IMAP port listens on the server itself for the
# built-in webmail
ssl = required
ssl_server_cert_file = {{.CertFile}}
ssl_server_key_file = {{.KeyFile}}
ssl_min_protocol = TLSv1.2
# TLS 1.2 only with forward-secret AEAD suites (TLS 1.3 has only those)
ssl_cipher_list = ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20
ssl_server_prefer_ciphers = server

# ---- sign-in: app passwords (random, so SHA-256 is enough); webmail
# tokens only from the server itself
auth_mechanisms = plain login
auth_allow_cleartext = no
auth_username_format = %{user | lower}
auth_failure_delay = 2s

sql_driver = pgsql
pgsql /var/run/postgresql {
  parameters {
    dbname = {{.DBName}}
    user = dovecot
  }
}

passdb sql {
  query = SELECT username AS "user", NULL AS password, 'yes' AS nopassword FROM mda_logins WHERE username = '%{user}' AND hash = encode(sha256(convert_to('%{password}', 'UTF8')), 'hex') AND (kind = 'app' OR '%{remote_ip}' IN ('127.0.0.1', '::1'))
}

userdb sql {
  query = SELECT home, uid, gid, quota_mb || 'M' AS quota_storage_size FROM mda_users WHERE username = '%{user}'
  iterate_query = SELECT username AS "user" FROM mda_users
}

# every customer has its own system user (2000000 + number)
first_valid_uid = 2000000
last_valid_uid = 2999999
first_valid_gid = 2000000
last_valid_gid = 2999999

mail_driver = maildir
mail_path = ~/Maildir
mail_plugins {
  quota = yes
  # shared folders between the mailboxes of one customer (the rights are
  # in the dovecot-acl file of the folder, written by the root helper)
  acl = yes
}
acl_driver = vfile
# which mailbox may see a shared folder at all: without this list the
# folders exist but no client is told about them. doveadm keeps it.
acl_sharing_map {
  dict file {
    path = /var/lib/dovecot/shared-mailboxes
  }
}

quota "User quota" {
  driver = count
}
quota_storage_size = 1G

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

# A folder another mailbox of the same customer opened: shared/<address>/.
# It shows up only when something is actually shared (list = children),
# the subscriptions stay in the private namespace, and the index of the
# reader is written into the reader's own directory, not the owner's.
namespace shared {
  type = shared
  separator = /
  prefix = shared/$user/
  mail_driver = maildir
  mail_path = %{owner_home}/Maildir
  mail_index_private_path = ~/Maildir/shared/%{owner_user}
  subscriptions = no
  list = children
}

protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_acl = yes
  }
  mail_max_userip_connections = 20
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

service imap-login {
  inet_listener imap {
    listen = 127.0.0.1
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service managesieve-login {
  inet_listener sieve {
    listen = 127.0.0.1
    port = 4190
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# the SQL lookups connect as the system user dovecot (peer authentication
# to the role dovecot)
service auth-worker {
  user = dovecot
}
{{- if .Rspamd}}

# spam settings of the mailbox (allowed and blocked senders, how much
# spam goes to Junk), before the user's own filters; written by the mail
# helper into the mail home
sieve_script spam {
  type = before
  path = ~/.emailzit/spam.sieve
}
{{- end}}
{{- if .AuthPolicyToken}}

# brute-force guard: the EmailZit panel decides before and learns after
# every sign-in (loopback only, shared token)
auth_policy_server_url = http://127.0.0.1:10032/
auth_policy_server_api_header = Authorization: Bearer {{.AuthPolicyToken}}
auth_policy_hash_nonce = {{.AuthPolicyToken}}
auth_policy_check_before_auth = yes
auth_policy_check_after_auth = no
auth_policy_report_after_auth = yes
auth_policy_request_attributes {
  login = %{requested_username}
  remote = %{remote_ip}
  protocol = %{protocol}
  session_id = %{session}
  fail_type = %{fail_type}
}
{{- end}}

# the user's own filters and auto-reply (written by EmailZit through
# ManageSieve on the server itself)
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
