# EmailZit: written by the root helper from the server settings.
# Changes here are overwritten. Users, passwords (app passwords only) and
# quotas come from PostgreSQL (database {{.DBName}}, role dovecot, views
# mda_users and mda_logins).
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap pop3 lmtp sieve
listen = *, ::
login_greeting = {{.Hostname}} ready.
log_path = syslog
syslog_facility = mail

# ---- TLS only; the plain IMAP port listens on the server itself for the
# built-in webmail
ssl = required
ssl_server_cert_file = {{.CertFile}}
ssl_server_key_file = {{.KeyFile}}
ssl_min_protocol = TLSv1.2

# ---- sign-in: app passwords (random, so SHA-256 is enough); webmail
# tokens only from the server itself
auth_mechanisms = plain login
auth_allow_cleartext = no
auth_username_format = %{user | lower}
auth_failure_delay = 2s

sql_driver = pgsql
pgsql /var/run/postgresql {
  parameters {
    dbname = {{.DBName}}
    user = dovecot
  }
}

passdb sql {
  query = SELECT username AS "user", NULL AS password, 'yes' AS nopassword FROM mda_logins WHERE username = '%{user}' AND hash = encode(sha256(convert_to('%{password}', 'UTF8')), 'hex') AND (kind = 'app' OR '%{remote_ip}' IN ('127.0.0.1', '::1'))
}

userdb sql {
  query = SELECT home, uid, gid, quota_mb || 'M' AS quota_storage_size FROM mda_users WHERE username = '%{user}'
  iterate_query = SELECT username AS "user" FROM mda_users
}

# every customer has its own system user (2000000 + number)
first_valid_uid = 2000000
last_valid_uid = 2999999
first_valid_gid = 2000000
last_valid_gid = 2999999

mail_driver = maildir
mail_path = ~/Maildir
mail_plugins {
  quota = yes
}

quota "User quota" {
  driver = count
}
quota_storage_size = 1G

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

protocol imap {
  mail_plugins {
    imap_quota = yes
  }
  mail_max_userip_connections = 20
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

service imap-login {
  inet_listener imap {
    listen = 127.0.0.1
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service managesieve-login {
  inet_listener sieve {
    listen = 127.0.0.1
    port = 4190
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# the SQL lookups connect as the system user dovecot (peer authentication
# to the role dovecot)
service auth-worker {
  user = dovecot
}
