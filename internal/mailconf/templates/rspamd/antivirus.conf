# EmailZit: written by the root helper (Settings -> Mail server -> virus scan).
# Every message goes through ClamAV; infected mail is refused.
clamav {
  type = "clamav";
  servers = "/run/clamav/clamd.ctl";
  symbol = "CLAM_VIRUS";
  action = "reject";
  message = "${SCANNER}: virus found: \"${VIRUS}\"";
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  max_size = 52428800;
  timeout = 15.0;
  retransmits = 1;
  log_clean = false;
}
