# EmailZit: written by the root helper (Settings -> Mail server -> virus scan).
# Every message goes through ClamAV. A virus is refused (force_actions.conf);
# spam signatures of Sanesecurity only add to the spam score.
clamav {
  type = "clamav";
  servers = "/run/clamav/clamd.ctl";
  symbol = "CLAM_VIRUS";
  patterns {
    CLAM_SPAM_SIGNATURE = "^Sanesecurity\.(Junk|Jurlbl|Scam|Spam|SpamImg|Spamattach|Blurl|Lott|Foxhole\.Generic\.Spam)";
  }
  # the whole message: Sanesecurity's mail signatures match headers and text
  scan_mime_parts = false;
  max_size = 52428800;
  timeout = 15.0;
  retransmits = 1;
  log_clean = false;
}
