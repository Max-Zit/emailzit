# EmailZit: written by the root helper; changes are overwritten.
# Signs mail of signed-in users with the key of the domain in the From
# header (the domain must have a key in the selector map).
enabled = true;
sign_authenticated = true;
sign_local = false;
sign_inbound = false;
use_domain = "header";
use_esld = false;
allow_hdrfrom_mismatch = false;
allow_username_mismatch = true;
try_fallback = false;
path = "/etc/rspamd/emailzit/dkim/$domain.$selector.key";
selector_map = "/etc/rspamd/emailzit/dkim_selectors.map";
