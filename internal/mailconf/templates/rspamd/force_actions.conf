# EmailZit: written by the root helper.
rules {
  # known phishing links, or a foreign sender posing as a colleague: the
  # subject says so in every mail program (refusals still win)
  EMAILZIT_PHISHING_WARNING {
    action = "rewrite subject";
    subject = "[Phishing?] %s";
    expression = "PHISHED_PHISHTANK | EMAILZIT_SPOOFED_NAME";
    honor_action = ["reject", "soft reject"];
  }
{{- if not .AllowDMARCFailures}}
  # the sender's own domain says such mail is forged (DMARC p=reject):
  # refuse it, as the large providers do. Mailing lists and forwarded mail
  # break DMARC by nature, so they are left to the spam score.
  EMAILZIT_DMARC_REJECT {
    action = "reject";
    message = "The sender domain refuses this mail (DMARC)";
    expression = "DMARC_POLICY_REJECT & !MAILLIST & !FORWARDED & !ARC_ALLOW";
    honor_action = ["soft reject"];
  }
  # p=quarantine: the domain asks for such mail to be treated as spam
  EMAILZIT_DMARC_QUARANTINE {
    action = "add header";
    expression = "DMARC_POLICY_QUARANTINE & !MAILLIST & !FORWARDED & !ARC_ALLOW";
    honor_action = ["reject", "soft reject"];
  }
{{- end}}
{{- if .ClamAV}}
  # a virus is refused with its own message (not as spam)
  EMAILZIT_VIRUS {
    action = "reject";
    message = "Virus found";
    expression = "CLAM_VIRUS";
  }
{{- end}}
}
