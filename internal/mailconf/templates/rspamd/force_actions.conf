# EmailZit: written by the root helper.
rules {
  # known phishing links, or a foreign sender posing as a colleague: the
  # subject says so in every mail program (refusals still win)
  EMAILZIT_PHISHING_WARNING {
    action = "rewrite subject";
    subject = "[Phishing?] %s";
    expression = "PHISHED_PHISHTANK | EMAILZIT_SPOOFED_NAME";
    honor_action = ["reject", "soft reject"];
  }
{{- if .ClamAV}}
  # a virus is refused with its own message (not as spam)
  EMAILZIT_VIRUS {
    action = "reject";
    message = "Virus found";
    expression = "CLAM_VIRUS";
  }
{{- end}}
}
