# EmailZit: written by the root helper.
{{- if not .AllowRiskyAttachments}}
# Programs, scripts, shortcuts, disk images and macro documents are refused,
# also inside archives (Settings -> Mail server -> attachments).
EMAILZIT_RISKY_ATTACHMENT {
  type = "filename";
  filter = "extension";
  regexp = true;
  map = "{{.RiskyMap}}";
  skip_archives = false;
  action = "reject";
  message = "This server does not accept programs, scripts or documents with macros as attachments. Share such files by link.";
  description = "Risky attachment type";
}
{{- end}}
# The display name of the sender names a domain of this server ("Boss
# acme.com <someone@elsewhere>"): the classic CEO fraud. Scored only
# together with a foreign sender address (composites.conf).
EMAILZIT_NAME_LOCAL_DOMAIN {
  type = "header";
  header = "From";
  filter = "email:name";
  regexp = true;
  map = "{{.LocalDomainsMap}}";
  score = 0.0;
  description = "The display name contains a domain of this server";
}
EMAILZIT_FROM_LOCAL_DOMAIN {
  type = "from";
  filter = "email:domain";
  regexp = true;
  map = "{{.LocalDomainsMap}}";
  score = 0.0;
  description = "The sender address is in a domain of this server";
}
