# EmailZit: written by the root helper.
# Mail of signed-in users (mail programs, webmail, websites) going out:
# spam is refused at a lower score, never marked or delayed (that would only
# reach the recipient), and the warnings for received mail do not apply.
# Refused spam counts towards the automatic block of the mailbox.
emailzit_outbound {
  priority = high;
  authenticated = true;
  apply {
    actions {
      reject = 10.0;
      "add header" = null;
      "rewrite subject" = null;
      greylist = null;
    }
    symbols_disabled = ["EMAILZIT_SPOOFED_NAME", "EMAILZIT_PHISHING_WARNING"];
  }
}
