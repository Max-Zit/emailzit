# EmailZit: written by the root helper; changes are overwritten.
# A local, validating resolver: DNS block lists answer only queries that
# do not come through big public resolvers, and DANE needs DNSSEC.
server:
    interface: 127.0.0.1@5335
{{- if .SystemResolver}}
    # the whole server resolves through it (/etc/resolv.conf)
    interface: 127.0.0.1@53
{{- end}}
    access-control: 127.0.0.0/8 allow
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
    so-sndbuf: 0
