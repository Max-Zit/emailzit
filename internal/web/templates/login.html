{{template "guest" .}}
{{define "content"}}
<h1>{{.T "Sign in"}}</h1>
<form method="post" action="{{.Data.Base}}/login" class="stack">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>{{if .Data.Base}}{{.T "E-mail address"}}{{else}}{{.T "Username"}}{{end}}<input name="username" value="{{.Data.Username}}" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false"></label>
  <label>{{.T "Password"}}<input type="password" name="password" required autocomplete="current-password"></label>
  <button class="primary">{{.T "Sign in"}}</button>
</form>
{{if and .Data.OIDC (not .Data.Base)}}<p class="center mt"><a class="btn secondary" href="/login/oidc?next={{.Data.Next}}">{{template "icon" "key"}}{{if eq .Data.OIDC "Company sign-in"}}{{.T "Company sign-in"}}{{else}}{{.Data.OIDC}}{{end}}</a></p>{{end}}
{{end}}
