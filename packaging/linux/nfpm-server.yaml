name: emailzit-server
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: mail
priority: optional
maintainer: MaxZit <office@maxzit.com>
description: |
  EmailZit: self-hosted mail hosting for many domains and customers with an
  admin panel, a customer panel, webmail and a REST API. Postfix, Dovecot
  and Rspamd from Debian, configured and kept in shape by EmailZit.
vendor: MaxZit
homepage: https://github.com/Max-Zit/emailzit
license: AGPL-3.0-only
overrides:
  deb:
    depends:
      - postfix
      - postfix-pgsql
      - dovecot-core
      - dovecot-imapd
      - dovecot-pop3d
      - dovecot-lmtpd
      - dovecot-pgsql
      - dovecot-sieve
      - dovecot-managesieved
      - postgresql
      - rspamd
      - valkey-server | redis-server
      - nftables
      - openssl
      - ca-certificates
      - unbound
      - dns-root-data
      - gpgv
contents:
  # every file states its mode: nfpm on Windows gives 0664 to a file without
  # file_info, which some tools (logrotate, systemd) refuse
  - src: ./LICENSE
    dst: /usr/share/doc/emailzit-server/copyright
    file_info:
      mode: 0644
  - src: ./THIRD_PARTY_LICENSES.md
    dst: /usr/share/doc/emailzit-server/THIRD_PARTY_LICENSES.md
    file_info:
      mode: 0644
  - src: ./bin/pkg/emailzit-server
    dst: /usr/bin/emailzit-server
    file_info:
      mode: 0755
  - src: ./packaging/linux/emailzit-server.service
    dst: /usr/lib/systemd/system/emailzit-server.service
    file_info:
      mode: 0644
  - src: ./packaging/linux/emailzit-mail-helper.service
    dst: /usr/lib/systemd/system/emailzit-mail-helper.service
    file_info:
      mode: 0644
  - src: ./packaging/linux/emailzit-submit.socket
    dst: /usr/lib/systemd/system/emailzit-submit.socket
    file_info:
      mode: 0644
  - src: ./bin/pkg/emailzit-sendmail
    dst: /usr/sbin/emailzit-sendmail
    file_info:
      mode: 0755
  - src: ./packaging/linux/emailzit-helper.path
    dst: /usr/lib/systemd/system/emailzit-helper.path
    file_info:
      mode: 0644
  - src: ./packaging/linux/emailzit-helper.service
    dst: /usr/lib/systemd/system/emailzit-helper.service
    file_info:
      mode: 0644
  - src: ./packaging/setup.sh
    dst: /usr/share/emailzit/setup.sh
    file_info:
      mode: 0755
  - src: ./packaging/linux/server.env
    dst: /etc/emailzit/server.env
    type: config|noreplace
    file_info:
      mode: 0640
scripts:
  postinstall: ./packaging/linux/server-postinstall.sh
  preremove: ./packaging/linux/server-preremove.sh
